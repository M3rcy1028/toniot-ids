<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1110" viewBox="0 0 1000 1110" role="img" aria-labelledby="title desc"><title id="title">Experiment pipeline</title><desc id="desc">Network records are split, transformed, used for baseline training and class-aware XAI selection, then validated before test evaluation and deployment.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#64748b"/></marker></defs><rect width="1000" height="1110" rx="22" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="53" font-size="30" fill="#0f172a" font-weight="700" text-anchor="start">From network records to a deployable model</text><text x="48" y="87" font-size="19" fill="#475569" font-weight="400" text-anchor="start">Feature selection uses training data; early stopping and acceptance use validation.</text><rect x="48" y="123" width="904" height="110" rx="15" fill="#ffffff" stroke="#cbd5e1"/><rect x="48" y="123" width="8" height="110" rx="4" fill="#2563eb"/><text x="78" y="171" font-size="28" fill="#2563eb" font-weight="700" text-anchor="start">01</text><text x="143" y="166" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">TON_IoT network CSV</text><text x="143" y="200" font-size="18" fill="#475569" font-weight="400" text-anchor="start">211,043 records / 44 columns / ten traffic classes</text><path d="M500 238 V267" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="48" y="276" width="904" height="110" rx="15" fill="#ffffff" stroke="#cbd5e1"/><rect x="48" y="276" width="8" height="110" rx="4" fill="#2563eb"/><text x="78" y="324" font-size="28" fill="#2563eb" font-weight="700" text-anchor="start">02</text><text x="143" y="319" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">Preprocessing and stratified split</text><text x="143" y="353" font-size="18" fill="#475569" font-weight="400" text-anchor="start">70% train / 15% validation / 15% test; 22 input features</text><path d="M500 391 V420" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="48" y="429" width="904" height="110" rx="15" fill="#ffffff" stroke="#cbd5e1"/><rect x="48" y="429" width="8" height="110" rx="4" fill="#7c3aed"/><text x="78" y="477" font-size="28" fill="#7c3aed" font-weight="700" text-anchor="start">03</text><text x="143" y="472" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">Baseline LightGBM + training-set XAI</text><text x="143" y="506" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Macro-SAGE core + class-wise SHAP / approximate CPFI protection</text><path d="M500 544 V573" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="48" y="582" width="904" height="110" rx="15" fill="#ffffff" stroke="#cbd5e1"/><rect x="48" y="582" width="8" height="110" rx="4" fill="#7c3aed"/><text x="78" y="630" font-size="28" fill="#7c3aed" font-weight="700" text-anchor="start">04</text><text x="143" y="625" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">Retrain reduced candidates</text><text x="143" y="659" font-size="18" fill="#475569" font-weight="400" text-anchor="start">22 -&gt; 18 -&gt; 16 -&gt; 14 features; preserve attack-specific information</text><path d="M500 697 V726" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="48" y="735" width="904" height="110" rx="15" fill="#ffffff" stroke="#cbd5e1"/><rect x="48" y="735" width="8" height="110" rx="4" fill="#0f766e"/><text x="78" y="783" font-size="28" fill="#0f766e" font-weight="700" text-anchor="start">05</text><text x="143" y="778" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">Validation gate, then test evaluation</text><text x="143" y="812" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Accuracy / macro F1 / MITM recall gate; 14-feature candidate rejected</text><path d="M500 850 V879" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="48" y="888" width="904" height="110" rx="15" fill="#ffffff" stroke="#cbd5e1"/><rect x="48" y="888" width="8" height="110" rx="4" fill="#0f766e"/><text x="78" y="936" font-size="28" fill="#0f766e" font-weight="700" text-anchor="start">06</text><text x="143" y="931" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">18-feature model used by the companion system</text><text x="143" y="965" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Stored model + encoders + scaler + ordered feature list</text><text x="48" y="1070" font-size="19" fill="#475569" font-weight="400" text-anchor="start">Model predictions support device-risk access decisions in the companion security system.</text></g></svg>
