<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">TON IoT IDS</title><desc id="desc">Explainable LightGBM intrusion detection with 18 features and ten classes.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1223"/><stop offset="1" stop-color="#172f50"/></linearGradient></defs><rect width="1000" height="360" rx="24" fill="url(#bg)"/><g font-family="Arial, Helvetica, sans-serif"><text x="44" y="51" font-size="17" fill="#5eead4" font-weight="600" text-anchor="start">NETWORK SECURITY  /  EXPLAINABLE MACHINE LEARNING</text><text x="44" y="112" font-size="47" fill="#ffffff" font-weight="700" text-anchor="start">TON IoT IDS</text><text x="44" y="150" font-size="24" fill="#cbd5e1" font-weight="400" text-anchor="start">LightGBM + class-aware XAI feature selection</text><rect x="44" y="192" width="220" height="119" rx="12" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".15"/><text x="62" y="240" font-size="30" fill="#ffffff" font-weight="700" text-anchor="start">211,043</text><text x="62" y="277" font-size="17" fill="#bfdbfe" font-weight="400" text-anchor="start">network records</text><rect x="282" y="192" width="220" height="119" rx="12" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".15"/><text x="300" y="240" font-size="30" fill="#ffffff" font-weight="700" text-anchor="start">10</text><text x="300" y="277" font-size="17" fill="#bfdbfe" font-weight="400" text-anchor="start">traffic classes</text><rect x="520" y="192" width="220" height="119" rx="12" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".15"/><text x="538" y="240" font-size="30" fill="#ffffff" font-weight="700" text-anchor="start">18</text><text x="538" y="277" font-size="17" fill="#bfdbfe" font-weight="400" text-anchor="start">selected features</text><rect x="758" y="192" width="220" height="119" rx="12" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".15"/><text x="776" y="240" font-size="30" fill="#ffffff" font-weight="700" text-anchor="start">97.8172%</text><text x="776" y="277" font-size="17" fill="#bfdbfe" font-weight="400" text-anchor="start">test accuracy</text></g></svg>
